<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página de bienvenida del Departamento de Soporte de LEG.">
  <title>Hola mundo | Soporte LEG</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #0b1220; color: #f1f5f9; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 780px); border: 1px solid #29374b; border-radius: 28px; padding: clamp(28px, 7vw, 72px); background: linear-gradient(135deg, #18263b, #101a2b); box-shadow: 0 24px 80px #0004; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 64px; font-weight: 700; letter-spacing: .15em; }
    .logo { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: #73edc0; color: #10261f; font-size: 18px; letter-spacing: -.04em; }
    .eyebrow { color: #73edc0; font-size: 12px; font-weight: 700; letter-spacing: .2em; }
    h1 { font-size: clamp(48px, 10vw, 88px); line-height: 1.05; letter-spacing: -.06em; margin: 20px 0; }
    .department { max-width: 530px; font-size: clamp(18px, 4vw, 25px); line-height: 1.5; color: #c7d4e5; margin: 0; }
    .department strong { color: #fff; }
    footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid #29374b; color: #a7b6cb; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main aria-labelledby="saludo">
    <div class="brand"><span class="logo" aria-hidden="true">LEG</span><span>SOPORTE</span></div>
    <p class="eyebrow">BIENVENIDOS</p>
    <h1 id="saludo">HOLA MUNDO<span style="color:#73edc0">.</span></h1>
    <p class="department">Un saludo del <strong>DEPARTAMENTO DE SOPORTE DE LEG</strong>.</p>
    <footer>Nuestra primera página web. Un pequeño comienzo para grandes soluciones.</footer>
  </main>
</body>
</html>
